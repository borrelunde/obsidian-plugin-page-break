name: Release

on:
    workflow_dispatch:  # Manual trigger from GitHub Actions

permissions:
    contents: write  # Write permission is required to create a GitHub Release.

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            # Check out the code so the job can access it, with the full history so that semantic-release can analyse
            # commits.
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: '0'

            # Set up Node.js 20 because NPM is used in the next steps.
            -   name: Use Node.js 20
                uses: actions/setup-node@v4
                with:
                    node-version: 20
                    cache: npm

            # Install the dependencies.
            -   name: Install dependencies
                run: npm ci  # The same as running `npm install`, but 'npm ci' is faster and more reliable for
                # continuous integration.

            # Build the plugin.
            -   name: Build
                run: npm run build

            # Run semantic-release which will:
            # 1. Analyse commits to determine the next version
            # 2. Generate release notes
            # 3. Update package.json
            # 4. Update manifest.json and versions.json
            # 5. Commit all changes back to master
            # 6. Create a tag
            # 7. Create a GitHub release with assets
            -   name: Run semantic-release
                run: npx semantic-release
                env:
                    GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
